# Mirrors `main` to GitHub on every push, purely so Render/Vercel (which
# don't support this university's self-hosted GitLab) have something to
# deploy from. GitLab stays the real repo - never push to GitHub directly,
# it just gets overwritten on the next mirror run.
#
# Requires a GitLab CI/CD variable named GITHUB_MIRROR_TOKEN (a GitHub
# Personal Access Token with push access to the mirror repo), added as
# Settings -> CI/CD -> Variables, marked both Protected and Masked.
#
# Runs on a project runner registered on Adriaan's laptop (tag
# resvis-local, shell executor) - the department's shared instance
# runners have been stale for 3+ years, so this job won't pick up on
# instance runners even though they're technically enabled. No Docker
# image needed since the shell executor just runs `git` directly.

mirror-to-github:
  stage: deploy
  tags:
    - resvis-local
  variables:
    GIT_DEPTH: 0
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    # Pushed straight to a URL (no named remote) since the shell
    # executor reuses the same checkout between runs - a named remote
    # from a previous run would make "git remote add" fail the second
    # time around.
    - git push "https://adriaanHiemstra:${GITHUB_MIRROR_TOKEN}@github.com/adriaanHiemstra/resvis-west-coast-vikings.git" HEAD:refs/heads/main --force
